<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;background:transparent;">
  <audio id="music" loop preload="auto">
    <source src="starwars.mp3" type="audio/mp3">
  </audio>
  <script>
    const music = document.getElementById('music');
    music.volume = 0.4;

    // Reprend à la bonne position
    const savedTime = parseFloat(sessionStorage.getItem('sw_music_time') || '0');
    music.currentTime = savedTime;

    // Sauvegarde la position toutes les secondes
    setInterval(() => {
      if (!music.paused) {
        sessionStorage.setItem('sw_music_time', music.currentTime);
      }
    }, 1000);

    window.addEventListener('message', e => {
      if (e.data === 'play') music.play().catch(() => {});
      if (e.data === 'pause') music.pause();
    });

    // Démarre automatiquement si déjà en lecture
    music.play().catch(() => {});
  </script>
</body>
</html>
