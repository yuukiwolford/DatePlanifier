<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;background:transparent;">
  <audio id="music" loop preload="auto">
    <source src="Star Wars.mp3" type="audio/mp3">
  </audio>
  <script>
    const music = document.getElementById('music');
    music.volume = 0.4;

    const savedTime = parseFloat(sessionStorage.getItem('sw_music_time') || '0');
    music.currentTime = savedTime;

    setInterval(() => {
      if (!music.paused) sessionStorage.setItem('sw_music_time', music.currentTime);
    }, 1000);

    music.play().catch(() => {
      // Fallback : attend un click sur la page parente
      window.addEventListener('message', e => {
        if (e.data === 'play') music.play().catch(() => {});
      });
    });
  </script>
</body>
</html>
