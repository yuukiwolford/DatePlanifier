<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choisir la Date 📅</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stars-container"></div>
<div class="hyperspace-overlay" id="hyperspace"></div>

<div class="page active" id="page-date">
  <div class="date-title">Quand se déroule cette mission ? 📅</div>
  <div class="date-sub">"Le moment propice, il faut choisir." – Yoda</div>
  <div class="saber-divider"></div>

  <div class="date-form">
    <div class="calendar-header">
      <button class="cal-nav" id="cal-prev">‹</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>

    <div class="form-group" style="margin-top:1rem;">
      <label>⏰ HEURE DU RENDEZ-VOUS</label>
      <input type="time" id="time-input" value="14:00">
    </div>

    <div id="selected-date-display" class="selected-date-display" style="display:none;"></div>

    <button class="continue-btn visible" onclick="validateDate()" style="margin-top:0;">
      Activer l'hyperdrive →
    </button>
  </div>
</div>

<script src="script.js"></script>
<script>
  let reservedDates  = [];
  let currentCalDate = new Date();
  let selectedDateStr = localStorage.getItem('sw_date') || null;

  // Restaure l'heure si déjà choisie
  const savedTime = localStorage.getItem('sw_time');
  if (savedTime) document.getElementById('time-input').value = savedTime;

  fetch('dates.json')
    .then(r => r.json())
    .then(data => { reservedDates = data.reserved || []; })
    .catch(() => { reservedDates = []; })
    .then(() => renderCalendar());

  function renderCalendar() {
    const grid  = document.getElementById('calendar-grid');
    const label = document.getElementById('cal-month-label');
    grid.innerHTML = '';

    const year  = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    label.textContent = new Date(year, month).toLocaleDateString('fr-FR', {
      month: 'long', year: 'numeric'
    });

    ['LUN','MAR','MER','JEU','VEN','SAM','DIM'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-day-name';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const offset   = (firstDay === 0) ? 6 : firstDay - 1;
    for (let i = 0; i < offset; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }

    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const el      = document.createElement('div');
      el.className  = 'cal-day';
      el.textContent = d;

      const dateStr = `${year}-${String(month + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dateObj = new Date(year, month, d);

      if (dateObj < today) {
        el.classList.add('past');
      } else if (reservedDates.includes(dateStr)) {
        el.classList.add('disabled');
        el.title = 'Date déjà réservée 🚫';
      } else {
        el.addEventListener('click', () => selectDate(dateStr, d, month, year, el));
      }

      if (dateObj.toDateString() === today.toDateString()) el.classList.add('today');
      if (dateStr === selectedDateStr) el.classList.add('selected');

      grid.appendChild(el);
    }

    // Restaure l'affichage de la date sélectionnée
    if (selectedDateStr) {
      const [y, m, d] = selectedDateStr.split('-').map(Number);
      const display = document.getElementById('selected-date-display');
      const lbl = new Date(y, m - 1, d).toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      display.textContent = '📅 ' + lbl;
      display.style.display = 'block';
    }
  }

  function selectDate(dateStr, d, month, year, el) {
    selectedDateStr = dateStr;
    document.querySelectorAll('.cal-day.selected').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    const lbl = new Date(year, month, d).toLocaleDateString('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    const display = document.getElementById('selected-date-display');
    display.textContent = '📅 ' + lbl;
    display.style.display = 'block';
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    currentCalDate.setMonth(currentCalDate.getMonth() + 1);
    renderCalendar();
  });

  function validateDate() {
    const timeInput = document.getElementById('time-input').value;
    if (!selectedDateStr) { alert('Choisis une date, jeune Padawan ! 📅'); return; }
    if (!timeInput)       { alert("L'heure de la mission est manquante ! ⏰"); return; }

    // Sauvegarde dans localStorage
    localStorage.setItem('sw_date', selectedDateStr);
    localStorage.setItem('sw_time', timeInput);

    navigateTo('confirm.html');
  }
</script>
</body>
</html>
