<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Une Mission Secrète t'attend... 🌌</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="sw-music" loop>
  <source src="Star Wars.mp3" type="audio/mp3">
</audio>

<div id="stars-container"></div>
<div class="hyperspace-overlay" id="hyperspace"></div>

<div class="page active" id="page-splash">
  <div class="star-wars-logo">✦ STAR WARS ✦</div>
  <button onclick="launchSite()" class="launch-btn">
    ▶ COMMENCER LA MISSION
  </button>
  <p class="sound-hint">🔊 ACTIVE TON SON</p>
</div>
<nav class="nav-band">
  <a class="nav-step active" href="index.html"><span class="nav-step-icon">🌌</span>Accueil</a>
  <div class="nav-separator"></div>
  <span class="nav-step locked"><span class="nav-step-icon">🎬</span>Intro</span>
  <div class="nav-separator"></div>
  <span class="nav-step locked"><span class="nav-step-icon">💚</span>Mission</span>
  <div class="nav-separator"></div>
  <span class="nav-step locked"><span class="nav-step-icon">🎯</span>Activités</span>
  <div class="nav-separator"></div>
  <span class="nav-step locked"><span class="nav-step-icon">📅</span>Date</span>
  <div class="nav-separator"></div>
  <span class="nav-step locked"><span class="nav-step-icon">🎉</span>Confirm</span>
</nav>
<script src="script.js"></script>
<script>
  function launchSite() {
    const music = document.getElementById('sw-music');
    music.volume = 0.4;
    music.play();
    navigateTo('intro.html');
  }
</script>
</body>
</html>
